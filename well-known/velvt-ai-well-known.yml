summary: >-
  Real documents are served on both hosts: the A2A agent card at both the canonical and the legacy
  path (saved under a2a/), an MCP discovery document at /.well-known/mcp.json, and a provider-specific
  habitat manifest at /.well-known/velvt. That is a genuine WellKnown hit and the pointer is earned.
  Nothing RFC-standard beyond those is served: no security.txt (so NO SecurityTxt pointer), no
  openid-configuration, no oauth-authorization-server, no oauth-protected-resource, no api-catalog and
  no ai-plugin.json. The MCP server lives on the www host itself (https://www.velvt.ai/mcp), so there
  is no separate MCP host to probe; its 401 carries WWW-Authenticate: Bearer realm="Velvt MCP" and no
  resource_metadata parameter, consistent with the missing RFC 9728 document.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the 200s for agent-card.json, mcp.json and velvt on
  both hosts. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on both hosts.
false_positive_watch: >-
  Both hosts are a Next.js app on Vercel and answer every unknown path with a 404 that carries an HTML
  body (the framework's not-found page), so status codes here are trustworthy — none of the misses
  below were 200-with-a-shell.
